
name: FPL Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID || '2551369' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install requests gspread google-auth

      - name: Check season sync syntax
        run: python -m py_compile sync_my_season.py

      - name: Run main FPL update
        run: python fpl_update.py

      - name: Refresh My Season history
        run: python sync_my_season.py
